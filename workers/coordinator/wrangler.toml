name = "news-reader-coordinator"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "news-reader"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[queues.producers]]
binding = "FEED_QUEUE"
queue = "feed-ingestion"
